name: Automated Tagging

on:
  workflow_dispatch: # Trigger manually via GitHub Actions UI
    inputs:
      bump-type:
        description: 'Choose version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  create_tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # Ensure all commits and tags are fetched

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get the latest tag
        id: get-latest-tag
        run: |
          latest_tag=$(git tag --list --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="0.0.0"
          fi
          echo "Latest tag: $latest_tag"
          echo "::set-output name=latest::$latest_tag"

      - name: Determine next version
        id: bump-version
        run: |
          latest=${{ steps.get-latest-tag.outputs.latest }}
          bump_type=${{ github.event.inputs.bump-type }}

          # Extract MAJOR, MINOR, PATCH
          major=$(echo $latest | cut -d. -f1)
          minor=$(echo $latest | cut -d. -f2)
          patch=$(echo $latest | cut -d. -f3)

          if [ "$bump_type" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bump_type" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          elif [ "$bump_type" = "patch" ]; then
            patch=$((patch + 1))
          fi

          new_tag="$major.$minor.$patch"
          echo "New tag: $new_tag"
          echo "::set-output name=tag::$new_tag"

      - name: Create and push the new tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for authentication
        run: |
          new_tag=${{ steps.bump-version.outputs.tag }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag $new_tag
          git push origin $new_tag

      - name: Output new tag
        run: 'echo "New tag created: ${{ steps.bump-version.outputs.tag }}"'